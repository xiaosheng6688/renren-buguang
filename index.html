<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>人鱼补光 · 专业级手机补光灯</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;position:relative}
#lightCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden;transition:background .3s}
.light-layer{position:absolute;top:0;left:0;width:100%;height:100%;transition:opacity .3s}
#layoutOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#layoutOverlay .gl{position:absolute;background:rgba(255,255,255,0.1)}
#layoutOverlay .gl.h{left:0;right:0;height:1px}#layoutOverlay .gl.v{top:0;bottom:0;width:1px}
#layoutOverlay .gl.ht{top:33.33%}#layoutOverlay .gl.hm{top:50%}#layoutOverlay .gl.hb{top:66.66%}
#layoutOverlay .gl.vl{left:33.33%}#layoutOverlay .gl.vc{left:50%}#layoutOverlay .gl.vr{left:66.66%}
#layoutOverlay .rm{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:55vmin;height:55vmin;border-radius:50%;border:3px solid rgba(255,255,255,0.2)}
.layout-ring #layoutOverlay .rm{display:block}
.layout-ring #lightCanvas .light-layer{border-radius:50%;width:70vmin;height:70vmin;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#controls{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,0.9) 60%,transparent);padding:12px 14px env(safe-area-inset-bottom,16px) 14px;transition:transform .4s}
#controls.hidden{transform:translateY(100%)}
#topBar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:env(safe-area-inset-top,8px) 12px 8px 12px;background:linear-gradient(180deg,rgba(0,0,0,0.5),transparent);transition:opacity .4s;pointer-events:none}
#topBar.hidden{opacity:0}
#topBar .brand{font-size:.7rem;color:rgba(255,255,255,0.5);pointer-events:auto}
#topBar .actions{display:flex;gap:6px;pointer-events:auto}
#topBar .actions button{background:rgba(255,255,255,0.1);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
#topBar .actions button:active{background:rgba(255,255,255,0.25)}
#topBar .actions button.active{background:rgba(255,255,255,0.25)}
.tabs{display:flex;gap:4px;margin-bottom:8px;justify-content:center}
.tab{padding:5px 16px;border-radius:18px;font-size:.65rem;font-weight:500;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);border:none;cursor:pointer;transition:.2s}
.tab.active{background:rgba(255,255,255,0.2);color:#fff}
.panel{display:none}.panel.active{display:block}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:4px 0 8px}
.color-swatch{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.color-swatch.active{border-color:#fff;transform:scale(1.1)}
.color-swatch.active::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.55rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5)}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 0 8px}
.mode-btn{padding:7px 4px;border-radius:8px;font-size:.6rem;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.06);cursor:pointer;text-align:center;transition:.2s}
.mode-btn .mi{display:block;font-size:1rem}
.mode-btn.active{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.2)}
.pro-badge{font-size:.4rem;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;border-radius:2px;padding:1px 3px;margin-left:1px;vertical-align:super}
.layout-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:4px 0}
.layout-btn{padding:5px 4px;border-radius:6px;font-size:.55rem;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.06);cursor:pointer;text-align:center;transition:.2s}
.layout-btn .li{display:block;font-size:1.1rem}
.layout-btn.active{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.2)}
.slider-row{display:flex;align-items:center;gap:8px;margin:3px 0}
.slider-row label{font-size:.6rem;color:rgba(255,255,255,0.35);min-width:24px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,0.12);outline:none}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer}
.slider-row .val{font-size:.6rem;color:rgba(255,255,255,0.4);min-width:20px;text-align:right}
.tools-row{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.tool-btn{display:flex;align-items:center;gap:2px;padding:4px 8px;border-radius:6px;font-size:.58rem;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:.2s}
.tool-btn:active{transform:scale(.95)}
.tool-btn.active{background:rgba(255,255,255,0.15);color:#fff}
.wake-indicator{position:fixed;top:46px;left:50%;transform:translateX(-50%);z-index:11;background:rgba(0,0,0,0.5);padding:3px 10px;border-radius:12px;font-size:.55rem;color:rgba(255,255,255,0.4);display:none}
.wake-indicator.show{display:block}
#tapHint{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);z-index:9;font-size:.55rem;color:rgba(255,255,255,0.12);animation:pulseT 2s ease-in-out infinite;pointer-events:none;opacity:0;transition:opacity .5s}
#tapHint.show{opacity:1}
@keyframes pulseT{0%,100%{opacity:.12}50%{opacity:.3}}
#premiumPanel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;padding:20px}
#premiumPanel.show{display:flex}
#premiumPanel .modal{background:rgba(20,20,30,0.98);border-radius:20px;padding:24px 20px;max-width:320px;width:100%;text-align:center;border:1px solid rgba(255,255,255,0.06)}
#premiumPanel .modal h2{font-size:1.1rem;margin-bottom:4px;background:linear-gradient(135deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#premiumPanel .modal .sub{font-size:.72rem;color:rgba(255,255,255,0.35);margin-bottom:10px}
#premiumPanel .modal .qrs{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
#premiumPanel .modal .qrs .qi{text-align:center;cursor:pointer}
#premiumPanel .modal .qrs .qi .qb{width:90px;height:90px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,0.08);margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:.5rem;color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.03)}
#premiumPanel .modal .qrs .qi .qb img{width:100%;height:100%;object-fit:cover}
#premiumPanel .modal .qrs .qi .ql{font-size:.55rem;color:rgba(255,255,255,0.3)}
#premiumPanel .modal .price{font-size:1.4rem;font-weight:700;color:rgba(255,255,255,0.9);margin-bottom:6px}
#premiumPanel .modal .old-price{font-size:.7rem;color:rgba(255,255,255,0.2);text-decoration:line-through;margin-bottom:8px}
#premiumPanel .modal .btn-unlock{background:linear-gradient(135deg,#f093fb,#f5576c);border:none;color:#fff;padding:10px 30px;border-radius:12px;font-size:.85rem;cursor:pointer;transition:.2s;width:100%;margin-top:4px}
#premiumPanel .modal .btn-unlock:disabled{opacity:.4;cursor:default}
#premiumPanel .modal .btn-unlock:not(:disabled):active{transform:scale(.97)}
#premiumPanel .modal .tip{font-size:.65rem;color:rgba(255,255,255,0.3);margin-top:8px}
#premiumPanel .modal .countdown{font-size:2rem;font-weight:700;color:#4ade80;margin:6px 0;display:none}
#premiumPanel .modal .btn-skip{background:none;border:none;color:rgba(255,255,255,0.25);font-size:.7rem;cursor:pointer;margin-top:6px;padding:4px 8px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,0.85);color:#fff;padding:8px 18px;border-radius:10px;font-size:.72rem;opacity:0;transition:all .4s;z-index:30;pointer-events:none;border:1px solid rgba(255,255,255,0.05)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:360px){.color-grid{grid-template-columns:repeat(6,1fr)}.mode-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div id="lightCanvas"><div class="light-layer" id="lightLayer" style="background:#fff"></div></div>
<div id="layoutOverlay">
  <div class="gl h ht"></div><div class="gl h hm"></div><div class="gl h hb"></div>
  <div class="gl v vl"></div><div class="gl v vc"></div><div class="gl v vr"></div>
  <div class="rm"></div>
</div>
<div class="wake-indicator" id="wakeIndicator">🌙 屏幕常亮</div>
<div id="tapHint" class="show">点击屏幕显示控制面板</div>

<div id="topBar">
  <div class="brand">🧜‍♀️ 人鱼补光</div>
  <div class="actions">
    <button onclick="toggleWakeLock()" id="wakeBtn" title="屏幕常亮">🌙</button>
    <button onclick="toggleFullscreen()" title="全屏">⛶</button>
    <button onclick="showPremium()" title="解锁Pro" id="proBtn">💎</button>
  </div>
</div>

<div id="controls">
  <div class="tabs">
    <button class="tab active" data-tab="colors" onclick="switchTab('colors')">🎨 颜色</button>
    <button class="tab" data-tab="modes" onclick="switchTab('modes')">✨ 灯光</button>
    <button class="tab" data-tab="tools" onclick="switchTab('tools')">🔧 工具</button>
  </div>
  <div class="panel active" id="panelColors">
    <div class="color-grid" id="colorGrid"></div>
    <div class="slider-row">
      <label>☀️</label>
      <input type="range" id="brightnessSlider" min="5" max="100" value="100" oninput="updateBrightness(this.value)">
      <span class="val" id="brightnessVal">100%</span>
    </div>
  </div>
  <div class="panel" id="panelModes">
    <div class="mode-grid" id="modeGrid">
      <div class="mode-btn active" data-mode="steady" onclick="selectMode('steady')"><span class="mi">◉</span>常亮</div>
      <div class="mode-btn" data-mode="breathe" onclick="selectMode('breathe')"><span class="mi">〰️</span>呼吸</div>
      <div class="mode-btn" data-mode="pulse" onclick="selectMode('pulse')"><span class="mi">⚡</span>闪烁</div>
      <div class="mode-btn" data-mode="gradient" onclick="selectMode('gradient')"><span class="mi">🌈</span>渐变</div>
      <div class="mode-btn" data-mode="candle" onclick="selectMode('candle')"><span class="mi">🕯️</span>烛光</div>
      <div class="mode-btn" data-mode="aurora" onclick="selectMode('aurora')"><span class="mi">🌌</span>极光<span class="pro-badge">Pro</span></div>
      <div class="mode-btn" data-mode="music" onclick="selectMode('music')"><span class="mi">🎵</span>律动<span class="pro-badge">Pro</span></div>
      <div class="mode-btn" data-mode="strobe" onclick="selectMode('strobe')"><span class="mi">💥</span>爆闪<span class="pro-badge">Pro</span></div>
    </div>
    <div class="slider-row">
      <label>💨</label>
      <input type="range" id="speedSlider" min="1" max="10" value="5" oninput="updateSpeed(this.value)">
      <span class="val" id="speedVal">5</span>
    </div>
    <div class="layout-grid">
      <div class="layout-btn active" data-layout="full" onclick="selectLayout('full')"><span class="li">⬛</span>全屏</div>
      <div class="layout-btn" data-layout="top" onclick="selectLayout('top')"><span class="li">⬆️</span>上半</div>
      <div class="layout-btn" data-layout="bottom" onclick="selectLayout('bottom')"><span class="li">⬇️</span>下半</div>
      <div class="layout-btn" data-layout="ring" onclick="selectLayout('ring')"><span class="li">⭕</span>环形</div>
      <div class="layout-btn" data-layout="dual" onclick="selectLayout('dual')"><span class="li">◧</span>双色</div>
    </div>
  </div>
  <div class="panel" id="panelTools">
    <div class="tools-row">
      <button class="tool-btn" id="gridBtn" onclick="toggleGrid()">⊞ 网格<span class="pro-badge">Pro</span></button>
      <button class="tool-btn" id="levelBtn" onclick="toggleLevel()">◎ 水平仪<span class="pro-badge">Pro</span></button>
      <button class="tool-btn" id="mirrorBtn" onclick="toggleMirror()">🪞 镜像</button>
      <button class="tool-btn" onclick="showPremium()" style="color:#f093fb">💎 解锁Pro</button>
    </div>
    <div style="font-size:.55rem;color:rgba(255,255,255,0.15);padding:4px 0;line-height:1.6">
      <span id="modeLabel">常亮</span> · <span id="colorLabel">白色</span>
      <br>💡 手机亮度调到最大，效果更好
    </div>
  </div>
</div>

<!-- PRO MODAL -->
<div id="premiumPanel">
  <div class="modal">
    <h2>🧜‍♀️ 人鱼补光 Pro</h2>
    <div class="sub">解锁全部灯光特效</div>
    <div class="old-price">原价 ¥6.66</div>
    <div class="price">¥3.33</div>
    <div style="font-size:.65rem;color:rgba(255,255,255,0.2);margin-bottom:10px">🕐 永久使用 · 一杯奶茶钱</div>
    <div class="qrs">
      <div class="qi" onclick="enlargeQR('wechat')"><div class="qb" id="pwq">微信收款码</div><div class="ql">💚 微信</div></div>
      <div class="qi" onclick="enlargeQR('alipay')"><div class="qb" id="paq">支付宝收款码</div><div class="ql">💙 支付宝</div></div>
    </div>
    <div class="tip">👆 点击二维码放大 → 付款后返回点击下方</div>
    <button class="btn-unlock" id="payBtn" onclick="doUnlock()">💎 我付好了，立即解锁</button>
    <div class="countdown" id="unlockCD">3</div>
    <button class="btn-skip" onclick="hidePremium()">稍后再说</button>
  </div>
</div>

<!-- QR ENLARGE -->
<div id="qrEnlarge" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;flex-direction:column;padding:30px;cursor:pointer" onclick="closeQR()">
  <button style="position:absolute;top:env(safe-area-inset-top,20px);right:20px;background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer">✕</button>
  <img id="qrLargeImg" style="max-width:min(70vw,280px);max-height:70vw;border-radius:14px;background:#fff;padding:6px">
  <div style="font-size:.7rem;color:rgba(255,255,255,0.4);margin-top:12px">长按识别二维码付款</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
var S={
  color:'#ffffff',colorName:'纯白',brightness:parseInt(localStorage.getItem('lm_b'))||100,
  mode:'steady',layout:'full',speed:5,gridOn:false,levelOn:false,mirrorOn:false,
  isPremium:localStorage.getItem('lm_p')==='true',
  wakeLock:null,wakeOn:false,grad1:'#ff6b6b',grad2:'#a855f7'
};

// ===== PRESETS =====
var CP={
  basic:[{c:'#ffffff',n:'纯白'},{c:'#fff5f5',n:'粉白'},{c:'#fff0e6',n:'暖白'},{c:'#f0f8ff',n:'冷白'},{c:'#ffe4e1',n:'樱花粉'},{c:'#ffd1dc',n:'少女粉'},{c:'#ffb6c1',n:'浅粉'},{c:'#ffc0cb',n:'粉红'}],
  pro:[{c:'#ffffff',n:'纯白'},{c:'#fff5f5',n:'粉白'},{c:'#fff0e6',n:'暖白'},{c:'#f0f8ff',n:'冷白'},{c:'#ffe4e1',n:'樱花粉'},{c:'#ffd1dc',n:'少女粉'},{c:'#ffb6c1',n:'浅粉'},{c:'#ffc0cb',n:'粉红'},{c:'#fff4e0',n:'奶油'},{c:'#ffe4b5',n:'米黄'},{c:'#ffd700',n:'金色'},{c:'#ffa500',n:'橙色'},{c:'#ff8c00',n:'暖橙'},{c:'#ff6b35',n:'日落'},{c:'#ff7f50',n:'珊瑚'},{c:'#fa8072',n:'鲑鱼粉'},{c:'#f0f8ff',n:'冰蓝'},{c:'#e6f3ff',n:'天空'},{c:'#b0d4f1',n:'淡蓝'},{c:'#87ceeb',n:'天蓝'},{c:'#b0e0e6',n:'粉蓝'},{c:'#e0f7fa',n:'薄荷'},{c:'#ccffcc',n:'浅绿'},{c:'#98fb98',n:'柔绿'},{c:'#ff6b9d',n:'霓虹粉'},{c:'#c084fc',n:'炫紫'},{c:'#818cf8',n:'电蓝'},{c:'#34d399',n:'荧光绿'},{c:'#fbbf24',n:'亮黄'},{c:'#fb923c',n:'亮橙'},{c:'#ff6b6b',n:'红粉'},{c:'#e879f9',n:'亮紫'},{c:'#2d1b69',n:'星空紫'},{c:'#1a1a2e',n:'深夜蓝'},{c:'#16213e',n:'深海'},{c:'#0f3460',n:'靛蓝'},{c:'#533483',n:'紫罗兰'},{c:'#8b5cf6',n:'魔幻紫'},{c:'#ec4899',n:'魅粉'}]
};
var premiumModes=['aurora','music','strobe'];

function init(){
  document.getElementById('brightnessSlider').value=S.brightness;
  document.getElementById('brightnessVal').textContent=S.brightness+'%';
  renderColors();applyLight();setupTap();
  document.getElementById('customColorPicker')&&(document.getElementById('customColorPicker').value='#ffffff');
  if('wakeLock'in navigator&&!S.wakeOn)setTimeout(function(){toggleWakeLock()},1000);
}
function renderColors(){
  var g=document.getElementById('colorGrid');g.innerHTML='';
  var colors=S.isPremium?CP.pro:CP.basic;
  colors.forEach(function(c){
    var d=document.createElement('div');
    d.className='color-swatch'+(c.c===S.color?' active':'');
    d.style.background=c.c;d.title=c.n;
    d.onclick=function(){S.color=c.c;S.colorName=c.n;applyLight();
      document.querySelectorAll('.color-swatch').forEach(function(e){e.classList.remove('active')});
      this.classList.add('active');updateStatusLabel()};
    g.appendChild(d);
  });
}
function applyLight(){
  var L=document.getElementById('lightLayer'),C=document.getElementById('lightCanvas'),b=S.brightness/100;
  C.classList.remove('layout-ring');
  if(S.layout==='ring')C.classList.add('layout-ring');
  L.style.background=S.color;L.style.opacity=b;C.style.background='#000';L.style.animation='none';
  if(S.mode==='aurora'){L.style.background='linear-gradient(135deg,'+S.grad1+','+S.grad2+','+S.grad1+')';L.style.backgroundSize='400% 400%';L.style.animation='auAn '+(11-S.speed)+'s ease infinite'}
  applyLayout();stopAnim();
  if(['breathe','pulse','candle','strobe'].includes(S.mode))startAnim();
}
function applyLayout(){
  var L=document.getElementById('lightLayer'),C=document.getElementById('lightCanvas');C.classList.remove('layout-ring');
  L.style.borderRadius='0';L.style.width='100%';L.style.height='100%';L.style.position='absolute';L.style.top='0';L.style.left='0';L.style.transform='none';
  document.querySelectorAll('#layoutOverlay .gl').forEach(function(e){e.style.display='none'});
  document.querySelector('#layoutOverlay .rm').style.display='none';
  switch(S.layout){
    case'full':break;
    case'top':L.style.height='50%';L.style.top='0';break;
    case'bottom':L.style.height='50%';L.style.top='50%';break;
    case'ring':C.classList.add('layout-ring');L.style.borderRadius='50%';L.style.width='60vmin';L.style.height='60vmin';L.style.position='absolute';L.style.top='50%';L.style.left='50%';L.style.transform='translate(-50%,-50%)';break;
    case'dual':L.style.background='linear-gradient(90deg,'+S.color+' 50%,#ff6b6b 50%)';L.style.opacity=S.brightness/100;break;
  }
}
function selectMode(m){
  if(premiumModes.includes(m)&&!S.isPremium){showPremium();showToast('💎 解锁 Pro 可使用此模式');return}
  S.mode=m;document.querySelectorAll('.mode-btn').forEach(function(e){e.classList.toggle('active',e.dataset.mode===m)});
  document.getElementById('gradColorRow')&&(document.getElementById('gradColorRow').style.display=(m==='gradient'||m==='aurora')?'flex':'none');
  stopAnim();applyLight();updateStatusLabel();
}
function selectLayout(l){S.layout=l;document.querySelectorAll('.layout-btn').forEach(function(e){e.classList.toggle('active',e.dataset.layout===l)});applyLight()}
function updateBrightness(v){S.brightness=parseInt(v);localStorage.setItem('lm_b',v);document.getElementById('brightnessVal').textContent=v+'%';applyLight()}
function updateSpeed(v){S.speed=parseInt(v);document.getElementById('speedVal').textContent=v;if(['breathe','pulse','candle','strobe','gradient','aurora'].includes(S.mode)){stopAnim();applyLight()}}
var aid=null;
function startAnim(){var L=document.getElementById('lightLayer'),C=document.getElementById('lightCanvas');function loop(t){var sf=S.speed*0.5,b=S.brightness/100;switch(S.mode){case'breathe':{var a=(Math.sin(t/1000*sf)+1)/2;L.style.background=S.color;L.style.opacity=Math.max(0.05,b*0.2)+(b-Math.max(0.05,b*0.2))*a;C.style.background='#000'}break;case'pulse':{var p=(t/1000*sf*2)%1;a=p<0.3?1:(p<0.35?1-(p-0.3)/0.05:0);L.style.background=S.color;L.style.opacity=Math.max(0.05,b*a);C.style.background='#000'}break;case'candle':{var w=24+Math.random()*20;L.style.background='hsl('+w+',40%,'+(45+Math.random()*20)+'%)';L.style.opacity=Math.min(1,b*(0.85+Math.random()*0.15));C.style.background='#000'}break;case'strobe':{var o=(t/1000*sf*4)%1<0.5;L.style.background=o?S.color:'#000';L.style.opacity=o?b:0;C.style.background='#000'}break}aid=requestAnimationFrame(loop)}loop(0)}
function stopAnim(){if(aid){cancelAnimationFrame(aid);aid=null}document.getElementById('lightLayer').style.animation='none'}
function switchTab(t){document.querySelectorAll('.tab').forEach(function(e){e.classList.toggle('active',e.dataset.tab===t)});document.querySelectorAll('.panel').forEach(function(e){e.classList.remove('active')});document.getElementById('panel'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active')}

// ===== TAP =====
var cv=true,hht=null;
function setupTap(){
  document.addEventListener('click',function(e){
    if(e.target.closest('#controls')||e.target.closest('#topBar')||e.target.closest('#premiumPanel')||e.target.closest('#qrEnlarge'))return;
    toggleC();
  });
  resetHT();
}
function toggleC(){cv=!cv;document.getElementById('controls').classList.toggle('hidden',!cv);document.getElementById('topBar').classList.toggle('hidden',!cv);document.getElementById('tapHint').classList.toggle('show',!cv);if(cv)resetHT()}
function resetHT(){if(hht)clearTimeout(hht);hht=setTimeout(function(){if(cv){cv=false;document.getElementById('controls').classList.add('hidden');document.getElementById('topBar').classList.add('hidden');document.getElementById('tapHint').classList.add('show')}},6000)}

// ===== TOOLS =====
function toggleGrid(){if(!S.isPremium){showPremium();showToast('💎 解锁 Pro 使用网格');return}S.gridOn=!S.gridOn;document.getElementById('gridBtn').classList.toggle('active',S.gridOn);document.querySelectorAll('#layoutOverlay .gl').forEach(function(e){e.style.display=S.gridOn?'block':'none'});showToast(S.gridOn?'网格已显示':'网格已隐藏')}
function toggleLevel(){if(!S.isPremium){showPremium();showToast('💎 解锁 Pro 使用水平仪');return}S.levelOn=!S.levelOn;document.getElementById('levelBtn').classList.toggle('active',S.levelOn);var ex=document.getElementById('levelI');if(S.levelOn){if(ex)ex.remove();var d=document.createElement('div');d.id='levelI';d.style='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);z-index:2;pointer-events:none;background:rgba(0,0,0,0.2)';var dot=document.createElement('div');dot.id='levelD';dot.style='width:12px;height:12px;border-radius:50%;background:#fff;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:all .1s';d.appendChild(dot);document.body.appendChild(d);window.addEventListener('deviceorientation',handleL);showToast('📐 水平仪已开启')}else{window.removeEventListener('deviceorientation',handleL);if(ex)ex.remove();showToast('水平仪已关闭')}}
function handleL(e){var dot=document.getElementById('levelD');if(!dot)return;var g=e.gamma||0,bt=e.beta||0,x=Math.max(-25,Math.min(25,g/45*25)),y=Math.max(-25,Math.min(25,bt/45*25));dot.style.transform='translate(calc(-50% + '+x+'px), calc(-50% + '+y+'px))';dot.style.background=Math.sqrt(x*x+y*y)<5?'#4ade80':'#f87171'}
function toggleMirror(){S.mirrorOn=!S.mirrorOn;document.getElementById('mirrorBtn').classList.toggle('active',S.mirrorOn);document.getElementById('lightCanvas').style.transform=S.mirrorOn?'scaleX(-1)':'none';showToast(S.mirrorOn?'镜像已开启':'镜像已关闭')}

// ===== WAKE / FULLSCREEN =====
async function toggleWakeLock(){if(S.wakeOn){if(S.wakeLock)await S.wakeLock.release();S.wakeOn=false;document.getElementById('wakeBtn').classList.remove('active');document.getElementById('wakeIndicator').classList.remove('show');return}try{S.wakeLock=await navigator.wakeLock.request('screen');S.wakeOn=true;document.getElementById('wakeBtn').classList.add('active');document.getElementById('wakeIndicator').classList.add('show');S.wakeLock.addEventListener('release',function(){S.wakeOn=false;document.getElementById('wakeBtn').classList.remove('active');document.getElementById('wakeIndicator').classList.remove('show')})}catch(e){}}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(function(){})}else{document.exitFullscreen().catch(function(){})}}

// ===== PREMIUM (FIXED) =====
function showPremium(){
  ['pwq','paq'].forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    var img=new Image();var src=id==='pwq'?'images/wechat_qr.jpg':'images/alipay_qr.jpg';
    img.onload=function(){el.innerHTML='';el.appendChild(img);img.style.cssText='width:100%;height:100%;object-fit:cover;display:block'};
    img.onerror=function(){el.innerHTML='📱 放收款码'};
    img.src=src;
  });
  document.getElementById('premiumPanel').classList.add('show');
}
function hidePremium(){
  document.getElementById('premiumPanel').classList.remove('show');
  document.getElementById('unlockCD').style.display='none';
  document.getElementById('payBtn').disabled=false;
  document.getElementById('payBtn').style.opacity='1';
}
function doUnlock(){
  var btn=document.getElementById('payBtn');
  btn.disabled=true;btn.style.opacity='0.4';
  var cd=document.getElementById('unlockCD');
  cd.style.display='block';cd.textContent='3';
  var sec=3;
  var timer=setInterval(function(){
    sec--;
    cd.textContent=sec;
    if(sec<=0){
      clearInterval(timer);
      S.isPremium=true;
      localStorage.setItem('lm_p','true');
      hidePremium();
      renderColors();
      showToast('✅ Pro 已永久激活！所有功能已开放');
    }
  },1000);
}
function enlargeQR(type){
  var img=document.getElementById('qrLargeImg');
  var src=type==='wechat'?'images/wechat_qr.jpg':'images/alipay_qr.jpg';
  var tst=new Image();
  tst.onload=function(){img.src=src;document.getElementById('qrEnlarge').style.display='flex'};
  tst.onerror=function(){showToast('请先放收款码到 images/ 文件夹')};
  tst.src=src;
}
function closeQR(){document.getElementById('qrEnlarge').style.display='none'}

function shareApp(){var u=location.href,t='📸 人鱼补光 - 手机补光灯！比小猫补光灯更好用！';if(navigator.share){navigator.share({title:'人鱼补光',text:t,url:u}).catch(function(){})}else{navigator.clipboard.writeText(t+'\n'+u).then(function(){showToast('已复制')})}}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2200)}
function updateStatusLabel(){var mn={steady:'常亮',breathe:'呼吸',pulse:'闪烁',gradient:'渐变',aurora:'极光',candle:'烛光',music:'律动',strobe:'爆闪'};document.getElementById('modeLabel').textContent=mn[S.mode]||S.mode;document.getElementById('colorLabel').textContent=S.colorName}

// Aurora CSS
var as=document.createElement('style');as.textContent='@keyframes auAn{0%{background-position:0% 50%}25%{background-position:100% 0%}50%{background-position:100% 100%}75%{background-position:0% 100%}100%{background-position:0% 50%}}';document.head.appendChild(as);

document.addEventListener('DOMContentLoaded',init);
</script>
